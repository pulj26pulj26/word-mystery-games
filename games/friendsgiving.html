<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>美高派对疑云 · 厨房英语剧本杀</title>
<style>
:root{
  --bg:#0b0705;
  --ink:#faf6f0;
  --dim:rgba(250,246,240,.62);
  --faint:rgba(250,246,240,.38);
  --line:rgba(255,255,255,.13);
  --panel:rgba(255,255,255,.045);
  --amber:#ffab5e;
  --amber-ink:#2a1806;
  --green:#3ddc97;
  --red:#ff6b6b;
  --serif:Georgia,'Times New Roman','Songti SC','SimSun',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  min-height:100vh;padding:0 0 60px;touch-action:manipulation;
  background-image:radial-gradient(1200px 500px at 50% -10%,rgba(180,110,50,.16),transparent 60%);
}
#app{max-width:680px;margin:0 auto;padding:14px 14px 0;position:relative;z-index:1}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.topicon{width:34px;height:26px;flex:none}
.topicon .steam{fill:none;stroke:var(--amber);stroke-width:1.6;stroke-linecap:round;opacity:.85}
.topicon .pot{fill:none;stroke:#f5e3c8;stroke-width:1.8}
.topbar.alert .topicon .steam{stroke:var(--red)}
.top-title{font-size:.72rem;letter-spacing:.28em;color:var(--faint);text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden}
.badge-pill{font-family:var(--serif);font-size:.85rem;color:var(--amber);
  border:1px solid rgba(255,171,94,.35);border-radius:999px;padding:4px 12px;white-space:nowrap}
.home-link{color:var(--dim);text-decoration:none;font-size:.75rem;border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--panel);flex:none}
.home-link:active{transform:scale(.93);color:var(--amber)}
.snd-btn{border:1px solid var(--line);background:var(--panel);color:var(--dim);
  border-radius:999px;padding:4px 12px;font-size:.75rem;cursor:pointer;transition:.15s}
.snd-btn:active{transform:scale(.93)}

/* ---------- 场景 ---------- */
.scene{position:relative;border-radius:20px;overflow:hidden;background:#120b06;
  box-shadow:0 18px 50px rgba(0,0,0,.5);margin-bottom:14px}
.scene svg{display:block;width:100%;height:auto}
.scene::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.42) 100%)}
.act-tag{font-size:.7rem;letter-spacing:.3em;color:var(--faint);text-transform:uppercase;
  margin:2px 4px 10px;display:flex;align-items:center;gap:8px}
.act-tag::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- 对话框 ---------- */
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:16px 18px 14px;position:relative;cursor:pointer;transition:border-color .2s}
.dlg:active{border-color:rgba(255,255,255,.25)}
.who{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.22em;
  color:var(--amber);text-transform:uppercase;margin-bottom:8px}
.who::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--amber)}
.who.narr{color:var(--faint)}
.who.narr::before{background:var(--faint)}
.en{font-family:var(--serif);font-size:1.28rem;line-height:1.55;letter-spacing:.01em}
.en .w{color:var(--amber);border-bottom:1px dashed rgba(255,171,94,.55);cursor:pointer;padding:0 1px}
.cn{font-size:.86rem;color:var(--dim);margin-top:7px;line-height:1.6}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.spk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:transparent;color:var(--dim);border-radius:999px;padding:5px 12px;font-size:.75rem;cursor:pointer;transition:.15s}
.spk:active{transform:scale(.93);color:var(--amber);border-color:rgba(255,171,94,.5)}
.next-hint{font-size:.72rem;color:var(--faint);letter-spacing:.2em;animation:blink 1.6s ease infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 按钮 ---------- */
.btn{display:block;width:100%;padding:15px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--ink);
  font-size:.95rem;letter-spacing:.18em;font-family:var(--sans);transition:.18s;margin-top:14px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);border-color:transparent;color:var(--amber-ink);font-weight:700}
.btn.ghost{margin-top:10px;border-color:var(--line);color:var(--dim)}

/* ---------- 选项 / chips ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;
  padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);font-family:var(--serif);font-size:1.08rem;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.98)}
.opt .arrow{color:var(--faint);font-family:var(--sans);font-size:.8rem}
.opt.ok{border-color:var(--green);background:rgba(61,220,151,.1);color:var(--green)}
.opt.no{border-color:var(--red);background:rgba(255,107,107,.08);animation:shake .4s}
.opt.hint-pulse{animation:pulseHint 1s ease infinite}
.quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.quiz-grid .opt{justify-content:center;text-align:center;padding:18px 10px;font-size:1.02rem}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulseHint{0%,100%{box-shadow:0 0 0 0 rgba(255,171,94,0)}50%{box-shadow:0 0 0 5px rgba(255,171,94,.25);border-color:var(--amber)}}

/* ---------- 任务条 ---------- */
.task{display:flex;align-items:center;gap:10px;background:rgba(255,171,94,.06);
  border:1px solid rgba(255,171,94,.25);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.task .lab{font-size:.68rem;letter-spacing:.25em;color:var(--amber);flex:none}
.task .txt{font-family:var(--serif);font-size:1rem;line-height:1.5}
.task .txt b{color:var(--amber);font-weight:700;border-bottom:1px dashed rgba(255,171,94,.5)}
.feedback{margin-top:10px;font-size:.85rem;color:var(--dim);min-height:1.4em;line-height:1.5;padding:0 4px}
.feedback.bad{color:var(--red)}
.feedback.good{color:var(--green)}

/* ---------- 图标卡（工具/动作） ---------- */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tools.five{grid-template-columns:repeat(5,1fr)}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:16px;
  padding:12px 6px 10px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.tool:active{transform:scale(.95)}
.tool svg{width:44px;height:54px}
.tool .tname{font-size:.68rem;color:var(--faint);letter-spacing:.06em;opacity:0;transition:.3s;font-family:var(--serif)}
.tool.reveal .tname{opacity:1}
.tool.ok{border-color:var(--green);background:rgba(61,220,151,.1)}
.tool.no{border-color:var(--red);animation:shake .4s}
.tool.hint-pulse{animation:pulseHint 1s ease infinite}
@media (max-width:420px){.tools.five{grid-template-columns:repeat(3,1fr)}}

/* ---------- 顺序卡 ---------- */
.ocards{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ocard{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid var(--line);
  border-radius:14px;background:var(--panel);color:var(--ink);font-family:var(--serif);
  font-size:1.05rem;cursor:pointer;text-align:left;width:100%;transition:.15s}
.ocard:active{transform:scale(.98)}
.ocard .onum{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--faint);font-family:var(--sans)}
.ocard.ok{border-color:var(--green);background:rgba(61,220,151,.08)}
.ocard.ok .onum{background:var(--green);border-color:var(--green);color:#0a1f16;font-weight:700}
.ocard.no{border-color:var(--red);animation:shake .4s}
.ocard.hint-pulse{animation:pulseHint 1s ease infinite}

/* ---------- 嫌疑人 ---------- */
.susp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.scard{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px 8px 12px;
  cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:8px}
.scard:active{transform:scale(.95)}
.scard svg{width:56px;height:56px}
.scard .sname{font-family:var(--serif);font-size:1.05rem}
.scard .srole{font-size:.68rem;color:var(--faint)}
.scard.ok{border-color:var(--red);background:rgba(255,107,107,.1)}
.scard.no{border-color:var(--red);animation:shake .4s;opacity:.5}

/* ---------- 徽章 toast / toast ---------- */
.btoast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-24px) scale(.9);
  background:#1c120a;border:1px solid rgba(255,171,94,.45);border-radius:16px;padding:14px 22px;
  text-align:center;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,1.4,.4,1);z-index:99;
  box-shadow:0 14px 40px rgba(0,0,0,.6)}
.btoast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.btoast .bt-lab{font-size:.62rem;letter-spacing:.3em;color:var(--amber);margin-bottom:4px}
.btoast .bt-word{font-family:var(--serif);font-size:1.3rem;color:var(--ink)}
.btoast .bt-cn{font-size:.78rem;color:var(--dim);margin-top:2px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#ffab5e;color:#2a1806;padding:11px 22px;border-radius:24px;font-size:.88rem;
  opacity:0;transition:.3s;z-index:99;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 幕间 / 标题 ---------- */
.overlay-title{text-align:center;padding:56px 10px 30px}
.ov-line{font-size:.7rem;letter-spacing:.4em;color:var(--amber);text-transform:uppercase;margin-bottom:18px}
.ov-big{font-family:var(--serif);font-size:2.5rem;line-height:1.3;letter-spacing:.04em}
.ov-big .ch{display:inline-block;opacity:0;animation:chIn .5s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes chIn{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.ov-sub{color:var(--dim);font-size:.92rem;margin-top:14px;line-height:1.8}
.ov-en{font-family:var(--serif);color:var(--faint);font-size:.95rem;letter-spacing:.12em;margin-top:10px}
.fade-item{opacity:0;animation:fadeUp .55s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}

/* ---------- 结局 / 复盘 ---------- */
.cert{text-align:center;padding:26px 18px;border:1px solid rgba(255,171,94,.4);border-radius:20px;
  background:linear-gradient(180deg,rgba(255,171,94,.08),rgba(255,171,94,.02));margin-top:16px}
.cert .c-lab{font-size:.68rem;letter-spacing:.4em;color:var(--amber)}
.cert .c-title{font-family:var(--serif);font-size:1.8rem;margin-top:10px;line-height:1.4}
.cert .c-en{font-family:var(--serif);color:var(--dim);letter-spacing:.14em;margin-top:6px;font-size:.85rem}
.cert .c-stats{color:var(--faint);font-size:.8rem;margin-top:14px}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.bcell{border:1px solid rgba(255,171,94,.3);border-radius:12px;padding:9px 4px;text-align:center;background:rgba(255,171,94,.05)}
.bcell .bw{font-family:var(--serif);font-size:.8rem;color:var(--amber);line-height:1.3}
.bcell .bc{font-size:.64rem;color:var(--dim);margin-top:3px}
.word-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.wcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;cursor:pointer;transition:.15s;position:relative}
.wcard:active{transform:scale(.96)}
.wcard .we{font-family:var(--serif);font-size:1.1rem;color:var(--ink);line-height:1.35}
.wcard .wp{font-size:.72rem;color:var(--faint);margin-top:4px;font-family:var(--serif)}
.wcard .wc{font-size:.8rem;color:var(--dim);margin-top:4px}
.wcard.heard{border-color:rgba(61,220,151,.45)}
.wcard.heard::after{content:'✓';position:absolute;top:8px;right:10px;color:var(--green);font-size:.85rem}
.wcard .wact{font-size:.62rem;color:var(--faint);letter-spacing:.15em;margin-top:6px}
@media (max-width:380px){.badge-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar">
    <a class="home-link" href="../index.html">‹ 大厅</a>
    <svg class="topicon" viewBox="0 0 34 26">
      <path class="steam" d="M11 11 C9 8.5 13 6.5 11 4"><animate attributeName="opacity" values=".9;.3;.9" dur="1.8s" repeatCount="indefinite"/></path>
      <path class="steam" d="M17 11 C15 8.5 19 6.5 17 4"><animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/></path>
      <path class="steam" d="M23 11 C21 8.5 25 6.5 23 4"><animate attributeName="opacity" values=".9;.3;.9" dur="1.8s" begin=".5s" repeatCount="indefinite"/></path>
      <path class="pot" d="M5 15 H29 M7 15 V21 Q7 24 11 24 H23 Q27 24 27 21 V15 M3 15 H5 M29 15 H31"/>
    </svg>
    <div class="top-title">FRIENDSGIVING · 派对疑云</div>
    <div class="badge-pill" id="badge-pill">徽章 0/17</div>
    <button class="snd-btn" id="snd-btn">音效·开</button>
  </div>
  <div id="stage"></div>
</div>
<div class="btoast" id="btoast"></div>
<div class="toast" id="toast"></div>

<script>
(function(){

/* ================= 单词库（17 个烹饪动词） ================= */
var WORDS = {
  "peel":    {ph:"/piːl/", cn:"削皮", act:"第一幕"},
  "chop":    {ph:"/tʃɒp/", cn:"切碎", act:"第一幕"},
  "measure": {ph:"/ˈmeʒə/", cn:"量取", act:"第一幕"},
  "pour":    {ph:"/pɔː/", cn:"倒入", act:"第一幕"},
  "grease":  {ph:"/ɡriːs/", cn:"抹油", act:"第一幕"},
  "whisk":   {ph:"/wɪsk/", cn:"打蛋", act:"第二幕"},
  "stir":    {ph:"/stɜː/", cn:"搅拌", act:"第二幕"},
  "dip":     {ph:"/dɪp/", cn:"蘸", act:"第二幕"},
  "coat":    {ph:"/kəʊt/", cn:"裹粉", act:"第二幕"},
  "dredge":  {ph:"/dredʒ/", cn:"拍粉", act:"第二幕"},
  "fry":     {ph:"/fraɪ/", cn:"煎炸", act:"第三幕"},
  "boil":    {ph:"/bɔɪl/", cn:"煮沸", act:"第三幕"},
  "steam":   {ph:"/stiːm/", cn:"蒸", act:"第三幕"},
  "bake":    {ph:"/beɪk/", cn:"烘烤", act:"第三幕"},
  "brush":   {ph:"/brʌʃ/", cn:"刷酱", act:"第三幕"},
  "stuff":   {ph:"/stʌf/", cn:"填馅", act:"第三幕"},
  "wrap":    {ph:"/ræp/", cn:"包裹", act:"第三幕"}
};
var WORD_ORDER = ["peel","chop","measure","pour","grease",
  "whisk","stir","dip","coat","dredge",
  "fry","boil","steam","bake","brush","stuff","wrap"];
var WORD_KEYS = WORD_ORDER.slice().sort(function(a,b){return b.length-a.length;});
var TOTAL = WORD_ORDER.length;

/* ================= 剧本 ================= */
var ACTS = [
{ num:"第一幕", title:"备战厨房", en:"PREP TIME", sub:"解锁词汇：基础备菜动作", scene:"counter",
  steps:[
   {t:"say", who:"旁白", en:"Saturday, 4 p.m. The Friendsgiving party starts at six.",
     cn:"周六下午四点，David 家的大厨房。好友感恩节派对六点开始——交换生 Elsa 要做的秘制炸鸡卷和点心，全指望这两个小时了。"},
   {t:"say", who:"David", en:"Hi Elsa! Ready? Let's prep everything first.", cn:"嗨 Elsa！准备好了吗？我们先把食材都处理好。（听指令，点正确的动作图标）"},
   {t:"pick", icons:["peel","chop","measure","pour","grease"], rounds:[
     {en:"We need carrots. Please peel them first.", cn:"需要胡萝卜——先给它们削皮。", ans:"peel"},
     {en:"Now chop the carrots into small pieces.", cn:"现在把胡萝卜切成小块。", ans:"chop"},
     {en:"Let's make the batter. Measure 100g of flour.", cn:"来做面糊吧，量取 100 克面粉。", ans:"measure"},
     {en:"Then pour the milk into the bowl.", cn:"然后把牛奶倒进碗里。", ans:"pour"},
     {en:"Don't forget to grease the baking pan.", cn:"别忘了给烤盘抹油。", ans:"grease"}
   ]},
   {t:"say", who:"David", en:"Perfect prep! You work so fast.", cn:"备菜完美！你动作也太快了。"}
  ]},
{ num:"第二幕", title:"炸鸡危机", en:"THE CHICKEN CRISIS", sub:"解锁词汇：裹粉与腌制", scene:"messy",
  steps:[
   {t:"say", who:"旁白", en:"Something is wrong. The chicken is a mess — someone touched the recipe!",
     cn:"不对劲——要炸的虾和鸡肉被弄得乱七八糟，腌制和裹粉的步骤全乱了。有人动过配方！"},
   {t:"say", who:"David", en:"Look at the eggs... they are full of lumps.", cn:"你看这碗蛋液……全是块状。"},
   {t:"choice", who:"你（Elsa）", q:"The eggs are lumpy. Elsa should ___ them.", qcn:"蛋液有块状——该怎么处理？",
     opts:["stir","measure","whisk"], ans:"whisk", badge:"whisk",
     done:"Elsa whisks the eggs until smooth.",
     wrong:"不对哦——stir 只是轻轻搅，打匀蛋液要用 whisk（打蛋器快速打）。"},
   {t:"say", who:"旁白", en:"The chicken is worse: thick wet batter everywhere. But the flour bag is untouched.",
     cn:"鸡肉更糟——表面糊着厚厚的湿面糊，而干面粉袋根本没被打开过。"},
   {t:"choice", who:"你（Elsa）", q:"正确的炸鸡步骤是哪一个？", qcn:"修复配方②：选出正确做法",
     opts:["Coat it with wet batter.","Dip in egg, then dredge in flour.","Fry it right now."],
     ans:"Dip in egg, then dredge in flour.", badge2:["dip","dredge"],
     done:"Dip the chicken in egg, then dredge it in flour.",
     wrong:"湿面糊直接下锅会脱浆——先蘸蛋液，再拍干粉。"},
   {t:"order", mode:"text", task:"复原菜谱", hint:"三张菜谱卡被撕乱了——按正确顺序点出来",
     items:["Coat it with flour.","Whisk the eggs.","Dip the chicken in the eggs."],
     seq:["Whisk the eggs.","Dip the chicken in the eggs.","Coat it with flour."], badge:"coat"},
   {t:"say", who:"Sarah", en:"Only Mike went into the kitchen this afternoon. I saw him.", cn:"美食社社长 Sarah 走过来说：今天下午只有 Mike 进过厨房，她看见了。"},
   {t:"suspect"},
   {t:"say", who:"旁白", en:"Mike admits it. He didn't know the recipe at all.",
     cn:"Mike 低着头承认了：他完全看不懂英文菜谱，把 dry flour（干粉）当成了 wet batter（湿面糊）……"}
  ]},
{ num:"第三幕", title:"多线烹饪", en:"THE COOKING RELAY", sub:"解锁词汇：高阶烹饪动作", scene:"stove",
  steps:[
   {t:"say", who:"旁白", en:"Six o'clock is coming. Everyone joins the cooking relay!",
     cn:"六点快到了！朋友们都加入帮忙——烹饪接力赛开始。听清每道菜的做法，选对动作。"},
   {t:"pick", icons:["fry","boil","steam","bake"], rounds:[
     {en:"Main dish: fried chicken and eggs. Fry them golden!", cn:"主菜炸鸡和煎蛋——炸到金黄！", ans:"fry"},
     {en:"Tomato soup in the pot. Boil it slowly.", cn:"锅里的番茄汤——慢慢煮沸。", ans:"boil"},
     {en:"Baozi for a Chinese touch. Steam them for 10 minutes.", cn:"中国风的包子——蒸 10 分钟。", ans:"steam"},
     {en:"Chocolate cookies for dessert. Bake them at 180°C.", cn:"甜点巧克力饼干——180 度烘烤。", ans:"bake"}
   ]},
   {t:"choice", who:"David", q:"The soup smells great. Give it a gentle ___.", qcn:"汤很香了，轻轻___一下。",

/* ================= 语音 & 音效 ================= */
var VOICE = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  var vs = speechSynthesis.getVoices();
  VOICE = null;
  for(var i=0;i<vs.length;i++){ if(/^en[-_]US/i.test(vs[i].lang)){ VOICE=vs[i]; break; } }
  if(!VOICE){ for(var j=0;j<vs.length;j++){ if(/^en/i.test(vs[j].lang)){ VOICE=vs[j]; break; } } }
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text){
  if(S.muted || !('speechSynthesis' in window) || !text) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    if(VOICE) u.voice = VOICE;
    u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

var AC = null;
function tone(freq, delay, dur, type, vol){
  if(S.muted) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    var t0 = AC.currentTime + (delay||0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.12, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function sfxDing(){ tone(880,0,.14); tone(1318,.09,.18); }
function sfxBuzz(){ tone(150,0,.22,'sawtooth',.08); topbar.classList.add('alert'); setTimeout(function(){topbar.classList.remove('alert');},700); }
function sfxBadge(){ tone(660,0,.12); tone(880,.1,.12); tone(1320,.2,.22); }

/* 高亮 EN 文本里的目标单词 */
function hotEN(text){
  var out = text;
  WORD_KEYS.forEach(function(w){
    var re = new RegExp('\\b('+w+')(s|ed|ing)?\\b','i');
    out = out.replace(re, function(m){ return '<span class="w" data-w="'+w+'">'+m+'</span>'; });
  });
  return out;
}
function bindHotWords(root){
  var els = root.querySelectorAll('.w');
  for(var i=0;i<els.length;i++){
    (function(el){
      el.addEventListener('click', function(ev){
        ev.stopPropagation();
        speak(el.getAttribute('data-w'));
      });
    })(els[i]);
  }
}
function spkBtn(text){

    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+

/* ---------- 结局（双称号） ---------- */
function renderEnding(){
  sfxWin();
  var got = Object.keys(S.badges).length;
  var html =
    '<div class="scene fade-item">'+SCENES.feast()+'</div>'+
    '<div class="cert fade-item">'+
      '<div class="c-lab">晚宴圆满成功 · 通关达成</div>'+
      '<div class="c-title">美高社交达人 × 厨房英语大师</div>'+
      '<div class="c-en">PARTY STAR & KITCHEN ENGLISH MASTER</div>'+
      '<div class="c-stats">收集徽章 '+got+'/'+TOTAL+' 枚 · 用 17 个烹饪动词拯救了好友感恩节</div>'+
    '</div>'+
    '<div class="badge-grid fade-item" style="animation-delay:.2s">';
  WORD_ORDER.forEach(function(w){
    var has = S.badges[w];
    html += '<div class="bcell" style="'+(has?'':'opacity:.25')+'"><div class="bw">'+w+'</div><div class="bc">'+WORDS[w].cn+'</div></div>';
  });

    '<button class="btn ghost fade-item" id="again-btn" style="animation-delay:.45s">🔁 再玩一次</button>';
  stage.innerHTML = html;
  document.getElementById('review-btn').addEventListener('click', renderReview);
  document.getElementById('again-btn').addEventListener('click', function(){
    S.badges={}; S.heard={};
    document.getElementById('badge-pill').textContent='徽章 0/'+TOTAL;

/* ---------- 复盘 ---------- */
function renderReview(){
  var html =
    '<div class="act-tag">复盘 · 跟读挑战</div>'+
    '<div class="task"><span class="lab">彩蛋</span><span class="txt">点卡片听发音并跟读——盲盒抽词：抽到哪个就试试用它说一道菜的做法。<b id="heard-n">0</b>/'+TOTAL+'</span></div>'+
    '<div class="word-grid">';
  WORD_ORDER.forEach(function(w){
    var d = WORDS[w];
    html += '<div class="wcard'+(S.heard[w]?' heard':'')+'" data-w="'+w+'">'+
      '<div class="we">'+w+'</div><div class="wp">'+d.ph+'</div><div class="wc">'+d.cn+'</div>'+
      '<div class="wact">'+d.act+'</div></div>';
  });
  html += '</div><button class="btn ghost" id="back-end">返回结局</button>';
  stage.innerHTML = html;
  updateHeard();
  var cards = stage.querySelectorAll('.wcard');
  for(var i=0;i<cards.length;i++){
    (function(c){
      c.addEventListener('click', function(){
        var w = c.getAttribute('data-w');
        speak(w);
        if(!S.heard[w]){ S.heard[w]=true; c.classList.add('heard'); sfxDing(); updateHeard(); }
      });
    })(cards[i]);
  }
  document.getElementById('back-end').addEventListener('click', renderEnding);
}
function updateHeard(){
  var n = Object.keys(S.heard).length;
  var el = document.getElementById('heard-n');
  if(el) el.textContent = n;
  if(n>=TOTAL) toast('🎉 跟读完成！你是真正的厨房英语大师！');
}

});
