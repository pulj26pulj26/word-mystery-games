<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>急诊室之夜 · 英语单词剧本杀</title>
<style>
:root{
  --bg:#05070a;
  --ink:#f4f6f9;
  --dim:rgba(244,246,249,.62);
  --faint:rgba(244,246,249,.38);
  --line:rgba(255,255,255,.13);
  --panel:rgba(255,255,255,.045);
  --amber:#ffc069;
  --amber-ink:#241a08;
  --green:#3ddc97;
  --red:#ff6b6b;
  --serif:Georgia,'Times New Roman','Songti SC','SimSun',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  min-height:100vh;padding:0 0 60px;touch-action:manipulation;
  background-image:radial-gradient(1200px 500px at 50% -10%,rgba(60,90,140,.14),transparent 60%);
}
#app{max-width:680px;margin:0 auto;padding:14px 14px 0;position:relative;z-index:1}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.ecg{width:74px;height:26px;flex:none}
.ecg path{fill:none;stroke:var(--green);stroke-width:1.6;stroke-linecap:round;
  stroke-dasharray:46 160;animation:ecgmove 2.6s linear infinite}
.topbar.alert .ecg path{stroke:var(--red)}
@keyframes ecgmove{from{stroke-dashoffset:206}to{stroke-dashoffset:0}}
.top-title{font-size:.72rem;letter-spacing:.28em;color:var(--faint);text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden}
.badge-pill{font-family:var(--serif);font-size:.85rem;color:var(--amber);
  border:1px solid rgba(255,192,105,.35);border-radius:999px;padding:4px 12px;white-space:nowrap}
.home-link{color:var(--dim);text-decoration:none;font-size:.75rem;border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--panel);flex:none}
.home-link:active{transform:scale(.93);color:var(--amber)}
.snd-btn{border:1px solid var(--line);background:var(--panel);color:var(--dim);
  border-radius:999px;padding:4px 12px;font-size:.75rem;cursor:pointer;transition:.15s}
.snd-btn:active{transform:scale(.93)}

/* ---------- 场景 ---------- */
.scene{position:relative;border-radius:20px;overflow:hidden;background:#080d15;
  box-shadow:0 18px 50px rgba(0,0,0,.5);margin-bottom:14px}
.scene svg{display:block;width:100%;height:auto}
.scene::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.45) 100%)}
.act-tag{font-size:.7rem;letter-spacing:.3em;color:var(--faint);text-transform:uppercase;
  margin:2px 4px 10px;display:flex;align-items:center;gap:8px}
.act-tag::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- 对话框 ---------- */
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:16px 18px 14px;position:relative;cursor:pointer;transition:border-color .2s}
.dlg:active{border-color:rgba(255,255,255,.25)}
.who{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.22em;
  color:var(--amber);text-transform:uppercase;margin-bottom:8px}
.who::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--amber)}
.who.narr{color:var(--faint)}
.who.narr::before{background:var(--faint)}
.en{font-family:var(--serif);font-size:1.28rem;line-height:1.55;letter-spacing:.01em}
.en .w{color:var(--amber);border-bottom:1px dashed rgba(255,192,105,.55);cursor:pointer;padding:0 1px}
.cn{font-size:.86rem;color:var(--dim);margin-top:7px;line-height:1.6}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.spk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:transparent;color:var(--dim);border-radius:999px;padding:5px 12px;font-size:.75rem;cursor:pointer;transition:.15s}
.spk:active{transform:scale(.93);color:var(--amber);border-color:rgba(255,192,105,.5)}
.next-hint{font-size:.72rem;color:var(--faint);letter-spacing:.2em;animation:blink 1.6s ease infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 按钮 ---------- */
.btn{display:block;width:100%;padding:15px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--ink);
  font-size:.95rem;letter-spacing:.18em;font-family:var(--sans);transition:.18s;margin-top:14px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);border-color:transparent;color:var(--amber-ink);font-weight:700}
.btn.ghost{margin-top:10px;border-color:var(--line);color:var(--dim)}

/* ---------- 选项 / chips ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;
  padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);font-family:var(--serif);font-size:1.08rem;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.98)}
.opt .arrow{color:var(--faint);font-family:var(--sans);font-size:.8rem}
.opt.ok{border-color:var(--green);background:rgba(61,220,151,.1);color:var(--green)}
.opt.no{border-color:var(--red);background:rgba(255,107,107,.08);animation:shake .4s}
.opt.hint-pulse{animation:pulseHint 1s ease infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulseHint{0%,100%{box-shadow:0 0 0 0 rgba(255,192,105,0)}50%{box-shadow:0 0 0 5px rgba(255,192,105,.25);border-color:var(--amber)}}
.quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.quiz-grid .opt{justify-content:center;text-align:center;padding:18px 10px;font-size:1.02rem}

.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;justify-content:center}
.chip{padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
  color:var(--ink);font-family:var(--serif);font-size:1.02rem;cursor:pointer;transition:.15s}
.chip:active{transform:scale(.93)}
.chip.used{opacity:.22;pointer-events:none}
.chip.no{border-color:var(--red);animation:shake .4s}
.chip.hint-pulse{animation:pulseHint 1s ease infinite}

/* ---------- 任务条 ---------- */
.task{display:flex;align-items:center;gap:10px;background:rgba(255,192,105,.06);
  border:1px solid rgba(255,192,105,.25);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.task .lab{font-size:.68rem;letter-spacing:.25em;color:var(--amber);flex:none}
.task .txt{font-family:var(--serif);font-size:1rem;line-height:1.5}
.task .txt b{color:var(--amber);font-weight:700;border-bottom:1px dashed rgba(255,192,105,.5)}
.feedback{margin-top:10px;font-size:.85rem;color:var(--dim);min-height:1.4em;line-height:1.5;padding:0 4px}
.feedback.bad{color:var(--red)}
.feedback.good{color:var(--green)}

/* ---------- 工具卡 / 地图 ---------- */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:16px;
  padding:14px 8px 12px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:8px}
.tool:active{transform:scale(.95)}
.tool svg{width:52px;height:64px}
.tool .tname{font-size:.68rem;color:var(--faint);letter-spacing:.1em;opacity:0;transition:.3s}
.tool.reveal .tname{opacity:1}
.tool.ok{border-color:var(--green);background:rgba(61,220,151,.1)}
.tool.no{border-color:var(--red);animation:shake .4s}
.tool.hint-pulse{animation:pulseHint 1s ease infinite}
.map-wrap{margin-top:12px;border-radius:16px;overflow:hidden;background:#0a101a;border:1px solid var(--line)}
.map-wrap svg{display:block;width:100%;height:auto}
.spot{cursor:pointer}
.spot rect.hit{fill:transparent}
.spot.found .micon{stroke:var(--green);fill:rgba(61,220,151,.12)}
.spot.hint-pulse .micon{animation:pulseHint 1s ease infinite}
.map-label{font-size:11px;fill:rgba(244,246,249,.55);font-family:var(--sans)}
#player-dot{transition:cx .5s ease,cy .5s ease}
.door{cursor:pointer}
.door .dplate{fill:#131c30;stroke:#3a5380}
.door .dsym{stroke:#a8c0e4;fill:none}
.door.found .dsym{stroke:var(--green)}
.door.found .dplate{stroke:rgba(61,220,151,.5)}
.door.hint-pulse .dplate{animation:pulseHint 1s ease infinite}
.door text{font-family:var(--serif)}
#door-dot{transition:cx .5s ease,cy .5s ease}

/* ---------- 填空 ---------- */
.paper{background:#f3efe4;color:#2a2620;border-radius:6px;padding:20px 18px;margin-top:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);transform:rotate(-.6deg)}
.paper h4{font-family:var(--serif);letter-spacing:.25em;font-size:.72rem;color:#8a8378;text-transform:uppercase;
  border-bottom:1px solid #d8d2c4;padding-bottom:8px;margin-bottom:12px;text-align:center}
.paper .line{font-family:var(--serif);font-size:1.05rem;line-height:2.1}
.paper .blank{display:inline-block;min-width:120px;border-bottom:2px solid #8a8378;text-align:center;
  color:#b3541e;font-weight:700;padding:0 6px;transition:.2s}
.paper .blank.active{background:rgba(179,84,30,.08)}
.paper .blank.done{color:#2e7d4f;border-bottom-color:#2e7d4f}

/* ---------- 拼写 ---------- */
.slots{display:flex;gap:6px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.slot{width:36px;height:46px;border:1px solid var(--line);border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-family:var(--serif);font-size:1.4rem;color:var(--amber);
  background:var(--panel)}
.slot.on{border-color:var(--amber);background:rgba(255,192,105,.1)}

/* ---------- 徽章 toast ---------- */
.btoast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-24px) scale(.9);
  background:#12181f;border:1px solid rgba(255,192,105,.45);border-radius:16px;padding:14px 22px;
  text-align:center;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,1.4,.4,1);z-index:99;
  box-shadow:0 14px 40px rgba(0,0,0,.6)}
.btoast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.btoast .bt-lab{font-size:.62rem;letter-spacing:.3em;color:var(--amber);margin-bottom:4px}
.btoast .bt-word{font-family:var(--serif);font-size:1.3rem;color:var(--ink)}
.btoast .bt-cn{font-size:.78rem;color:var(--dim);margin-top:2px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#ffc069;color:#241a08;padding:11px 22px;border-radius:24px;font-size:.88rem;
  opacity:0;transition:.3s;z-index:99;font-weight:600;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 幕间 / 标题 ---------- */
.overlay-title{text-align:center;padding:56px 10px 30px}
.ov-line{font-size:.7rem;letter-spacing:.4em;color:var(--amber);text-transform:uppercase;margin-bottom:18px}
.ov-big{font-family:var(--serif);font-size:2.6rem;line-height:1.25;letter-spacing:.04em}
.ov-big .ch{display:inline-block;opacity:0;animation:chIn .5s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes chIn{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.ov-sub{color:var(--dim);font-size:.92rem;margin-top:14px;line-height:1.8}
.ov-en{font-family:var(--serif);color:var(--faint);font-size:.95rem;letter-spacing:.12em;margin-top:10px}

.fade-item{opacity:0;animation:fadeUp .55s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}

/* ---------- 结局 / 复盘 ---------- */
.cert{text-align:center;padding:26px 18px;border:1px solid rgba(255,192,105,.4);border-radius:20px;
  background:linear-gradient(180deg,rgba(255,192,105,.08),rgba(255,192,105,.02));margin-top:16px}
.cert .c-lab{font-size:.68rem;letter-spacing:.4em;color:var(--amber)}
.cert .c-title{font-family:var(--serif);font-size:2rem;margin-top:10px}
.cert .c-en{font-family:var(--serif);color:var(--dim);letter-spacing:.14em;margin-top:6px;font-size:.9rem}
.cert .c-stats{color:var(--faint);font-size:.8rem;margin-top:14px}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.bcell{border:1px solid rgba(255,192,105,.3);border-radius:12px;padding:9px 4px;text-align:center;background:rgba(255,192,105,.05)}
.bcell .bw{font-family:var(--serif);font-size:.78rem;color:var(--amber);line-height:1.3;word-break:break-word}
.bcell .bc{font-size:.64rem;color:var(--dim);margin-top:3px}
.word-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.wcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;cursor:pointer;transition:.15s;position:relative}
.wcard:active{transform:scale(.96)}
.wcard .we{font-family:var(--serif);font-size:1.05rem;color:var(--ink);line-height:1.35}
.wcard .wp{font-size:.72rem;color:var(--faint);margin-top:4px;font-family:var(--serif)}
.wcard .wc{font-size:.8rem;color:var(--dim);margin-top:4px}
.wcard.heard{border-color:rgba(61,220,151,.45)}
.wcard.heard::after{content:'✓';position:absolute;top:8px;right:10px;color:var(--green);font-size:.85rem}
.wcard .wact{font-size:.62rem;color:var(--faint);letter-spacing:.15em;margin-top:6px}
@media (max-width:380px){.badge-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar">
    <a class="home-link" href="../index.html">‹ 大厅</a>
    <svg class="ecg" viewBox="0 0 74 26"><path d="M0 14 H18 L24 14 L28 4 L33 22 L37 9 L40 14 H56 L60 11 L64 14 H74"/></svg>
    <div class="top-title">ER NIGHT · 急诊室之夜</div>
    <div class="badge-pill" id="badge-pill">徽章 0/16</div>
    <button class="snd-btn" id="snd-btn">音效·开</button>
  </div>
  <div id="stage"></div>
</div>
<div class="btoast" id="btoast"></div>
<div class="toast" id="toast"></div>

<script>
/* 整个游戏封装在独立作用域内运行，与宿主页面完全隔离，防止全局变量冲突 */
(function(){
/* ================= 单词库 ================= */
var WORDS = {
  "corridor":       {ph:"/ˈkɔːrɪdɔːr/", cn:"走廊", act:"第一幕"},
  "waiting chair":  {ph:"/ˈweɪtɪŋ tʃeə/", cn:"候诊椅", act:"第一幕"},
  "consulting room":{ph:"/kənˈsʌltɪŋ ruːm/", cn:"诊室", act:"第一幕"},
  "doctor":         {ph:"/ˈdɒktə/", cn:"医生", act:"第一幕"},
  "patient":        {ph:"/ˈpeɪʃnt/", cn:"患者", act:"第一幕"},
  "family member":  {ph:"/ˈfæməli ˈmembə/", cn:"家属", act:"第一幕"},
  "thermometer":    {ph:"/θəˈmɒmɪtə/", cn:"体温计", act:"第二幕"},
  "stethoscope":    {ph:"/ˈsteθəskəʊp/", cn:"听诊器", act:"第二幕"},
  "syringe":        {ph:"/sɪˈrɪndʒ/", cn:"注射器", act:"第二幕"},
  "medical report": {ph:"/ˈmedɪkl rɪˈpɔːt/", cn:"检查报告单", act:"第三幕"},
  "medical record": {ph:"/ˈmedɪkl ˈrekɔːd/", cn:"病历", act:"第三幕"},
  "medicine":       {ph:"/ˈmedɪsn/", cn:"药", act:"第三幕"},
  "Registration":   {ph:"/ˌredʒɪˈstreɪʃn/", cn:"挂号处", act:"第三幕"},
  "Pharmacy":       {ph:"/ˈfɑːməsi/", cn:"药房", act:"第三幕"},
  "Cardiology":     {ph:"/ˌkɑːdiˈɒlədʒi/", cn:"心内科", act:"第三幕"},
  "Radiology":      {ph:"/ˌreɪdiˈɒlədʒi/", cn:"放射科", act:"第三幕"}
};
var WORD_ORDER = ["corridor","waiting chair","consulting room","doctor","patient","family member",
  "thermometer","stethoscope","syringe",
  "medical report","medical record","medicine","Registration","Pharmacy","Cardiology","Radiology"];
var WORD_KEYS = WORD_ORDER.slice().sort(function(a,b){return b.length-a.length;});
var TOTAL = WORD_ORDER.length;

/* ================= 剧本 ================= */
var ACTS = [
{ num:"第一幕", title:"迷失走廊", en:"LOST IN THE CORRIDOR", sub:"解锁词汇：地点与人物", scene:"corridor",
  steps:[
   {t:"say", who:"分诊护士", en:"Who are you? What's wrong?", cn:"（深夜的急诊大厅，护士拦住了你）你是谁？怎么了？"},
   {t:"choice", who:"你", q:"I am a ______.", qcn:"护士问你是谁——选出正确的回答",
     opts:["doctor","patient","family member"], ans:"family member", badge:"family member",
     done:"I am a family member."},
   {t:"choice", who:"你", q:"My grandmother is a ______.", qcn:"告诉护士：外婆是患者",
     opts:["doctor","corridor","patient"], ans:"patient", badge:"patient",
     done:"My grandmother is a patient."},
   {t:"say", who:"分诊护士", en:"OK. Go down the corridor, turn left, sit on the waiting chair, and wait for the doctor in the consulting room.",
     cn:"好的。沿着走廊往前走，左转，坐在候诊椅上，在诊室门口等医生。"},
   {t:"map"},
   {t:"say", who:"旁白", en:"You found the consulting room. The doctor is coming.",
     cn:"你穿过走廊找到了诊室。门开了，一位医生快步走了出来。", badge:"doctor"},
   {t:"say", who:"医生", en:"Don't worry. I will take care of your grandmother.", cn:"别担心，我会照顾你的外婆。"}
  ]},
{ num:"第二幕", title:"问诊危机", en:"THE EXAMINATION", sub:"解锁词汇：医疗工具", scene:"room",
  steps:[
   {t:"say", who:"医生", en:"The patient has a fever. I need a thermometer.", cn:"病人发烧了，我需要体温计。（点选正确的工具递给医生）"},
   {t:"tool", ans:"thermometer"},
   {t:"say", who:"医生", en:"Good. Now I need to listen to her heart. Pass me the stethoscope.", cn:"好。现在我要听她的心跳，把听诊器递给我。"},
   {t:"tool", ans:"stethoscope"},
   {t:"say", who:"医生", en:"We need a blood test. Bring me a syringe.", cn:"我们需要验血，拿注射器来。"},
   {t:"tool", ans:"syringe"},
   {t:"say", who:"旁白", en:"Grandma looks scared of the needle.", cn:"看到针头，外婆紧张地抓住了你的手……用英语安慰她："},
   {t:"comfort"},
   {t:"say", who:"外婆", en:"Thank you, dear. I feel better now.", cn:"谢谢你，孩子。我好多了。"},
   {t:"say", who:"医生", en:"Well done, young man. The examination is finished.", cn:"干得好，年轻人。检查做完了。"}
  ]},
{ num:"第三幕", title:"真相追踪", en:"THE MISSING REPORT", sub:"解锁词汇：文件、药品与科室", scene:"room",
  steps:[
   {t:"say", who:"医生", en:"Oh no. The medical report is missing! Without it, I can't give her medicine.",
     cn:"糟了，外婆的检查报告单不见了！没有报告，就不能开药。"},
   {t:"say", who:"旁白", en:"You must find the medical report and the medical record.",
     cn:"你必须跑遍医院的科室，找回检查报告单和病历。先冲到了挂号处……"},
   {t:"doors", scene:"doors"},
   {t:"fill"},
   {t:"say", who:"医生", en:"Good news — it's just a bad cold with high blood pressure. She needs some medicine and rest.",
     cn:"好消息——只是重感冒引发的高血压，吃点药、好好休息就行。"},
   {t:"say", who:"旁白", en:"It was a false alarm! Take the report and run to the Pharmacy.",
     cn:"虚惊一场！拿上修好的报告单，冲向药房。"}
  ]},
{ num:"第四幕", title:"药房大决战", en:"THE FINAL BATTLE", sub:"终极考验：混合复习", scene:"pharmacy",
  steps:[
   {t:"say", who:"旁白", en:"The Pharmacy light is still on.", cn:"深夜的药房还亮着灯，药剂师推了推眼镜。", badge:"Pharmacy"},
   {t:"say", who:"药剂师", en:"Tell me what you need — and spell the word to get it.", cn:"告诉我你要什么——拼出这个单词，才能拿到它。"},

/* ================= 语音 & 音效 ================= */
var VOICE = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  var vs = speechSynthesis.getVoices();
  VOICE = null;
  for(var i=0;i<vs.length;i++){ if(/^en[-_]US/i.test(vs[i].lang)){ VOICE=vs[i]; break; } }
  if(!VOICE){ for(var j=0;j<vs.length;j++){ if(/^en/i.test(vs[j].lang)){ VOICE=vs[j]; break; } } }
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text){
  if(S.muted || !('speechSynthesis' in window) || !text) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    if(VOICE) u.voice = VOICE;
    u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

var AC = null;
function tone(freq, delay, dur, type, vol){
  if(S.muted) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    var t0 = AC.currentTime + (delay||0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.12, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function sfxDing(){ tone(880,0,.14); tone(1318,.09,.18); }
function sfxBuzz(){ tone(150,0,.22,'sawtooth',.08); topbar.classList.add('alert'); setTimeout(function(){topbar.classList.remove('alert');},700); }
function sfxBadge(){ tone(660,0,.12); tone(880,.1,.12); tone(1320,.2,.22); }
function sfxWin(){ tone(523,0,.16); tone(659,.14,.16); tone(784,.28,.16); tone(1047,.42,.4); }

/* 高亮 EN 文本里的目标单词 */
function hotEN(text){
  var out = text;
  WORD_KEYS.forEach(function(w){
    var re = new RegExp('\\b('+w.replace(/ /g,'\\s+')+')\\b','i');
    out = out.replace(re, function(m){ return '<span class="w" data-w="'+w+'">'+m+'</span>'; });
  });
  return out;
}
function bindHotWords(root){
  var els = root.querySelectorAll('.w');
  for(var i=0;i<els.length;i++){
    (function(el){
      el.addEventListener('click', function(ev){

        speak(el.getAttribute('data-w'));
      });
    })(els[i]);
  }
}

          }
        }else{
          btn.classList.add('no'); sfxBuzz(); fails++;
          fb.className='feedback bad'; fb.textContent='不对——下一个字母是 "'+WORD[idx]+'"。';
          setTimeout(function(){btn.classList.remove('no');},450);
          if(fails>=2){
            for(var j=0;j<chips.length;j++)
              if(chips[j].getAttribute('data-l')===WORD[idx] && !chips[j].classList.contains('used'))
                chips[j].classList.add('hint-pulse');
          }
        }
      });
    })(chips[i]);
  }
}

var QUIZ = [
  {q:"外婆发烧了，医生需要哪一个？", opts:["syringe","thermometer","corridor","stethoscope"], ans:"thermometer"},
  {q:"\"Where can you get the medicine?\"（在哪里取药？）", opts:["Radiology","Cardiology","Pharmacy","Registration"], ans:"Pharmacy"},
  {q:"候诊时，你坐在 ______ 上。", opts:["waiting chair","consulting room","corridor","syringe"], ans:"waiting chair"},
  {q:"\"The doctor uses a ______ to listen to her heart.\"", opts:["medicine","thermometer","syringe","stethoscope"], ans:"stethoscope"}
];
function renderQuiz(box, st){
  var qi=0, fails=0;
  var div = document.createElement('div');
  div.className='fade-item';
  box.appendChild(div);
  function draw(){
    var Q = QUIZ[qi];
    var h = '<div class="task"><span class="lab">考验 '+(qi+1)+'/4</span><span class="txt">'+hotEN(Q.q)+'</span></div>';
    h += '<div class="quiz-grid">';
    Q.opts.forEach(function(o){ h += '<button class="opt" data-o="'+o+'"><span>'+o+'</span></button>'; });
    h += '</div><div class="feedback"></div>';
    div.innerHTML = h;
    bindHotWords(div);
    var fb = div.querySelector('.feedback');
    var locked=false;
    var opts = div.querySelectorAll('.opt');
    for(var i=0;i<opts.length;i++){
      (function(btn){
        btn.addEventListener('click', function(){
          if(locked) return;
          var o = btn.getAttribute('data-o');
          speak(o);
          if(o===Q.ans){
            locked=true; btn.classList.add('ok'); sfxDing();
            qi++; fails=0;
            if(qi>=QUIZ.length){ setTimeout(next, 900); }
            else setTimeout(draw, 900);
          }else{
            btn.classList.add('no'); sfxBuzz(); fails++;
            fb.className='feedback bad'; fb.textContent='药剂师摇摇头："Think again."';
            setTimeout(function(){btn.classList.remove('no');},450);
            if(fails>=2){
              for(var j=0;j<opts.length;j++)
                if(opts[j].getAttribute('data-o')===Q.ans) opts[j].classList.add('hint-pulse');
            }
          }
        });
      })(opts[i]);
    }
  }
  draw();
}
