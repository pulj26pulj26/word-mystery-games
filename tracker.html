<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;touch-action:manipulation;
  background-image:radial-gradient(1100px 480px at 50% -10%,rgba(79,209,165,.10),transparent 60%)}
.wrap{max-width:680px;margin:0 auto;padding:12px 14px 86px}
.topbar{display:flex;align-items:center;gap:10px;padding:4px 2px 14px}
.hall{color:var(--faint);text-decoration:none;font-size:.85rem;padding:4px 6px;border-radius:8px}
.hall:active{background:var(--panel)}
.top-title{flex:1;font-size:.72rem;letter-spacing:.28em;color:var(--faint)}
.beans{font-size:.85rem;color:var(--acc2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.page{animation:pgIn .3s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hidden{display:none}
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px;margin-bottom:14px}
.cttl{font-size:.72rem;letter-spacing:.22em;color:var(--acc);margin-bottom:10px}
.big{font-family:var(--serif);font-size:1.5rem;line-height:1.35}
.mut{color:var(--dim);font-size:.85rem;line-height:1.7}
.faint{color:var(--faint);font-size:.78rem;line-height:1.6}
.btn{display:block;width:100%;text-align:center;border:none;border-radius:12px;padding:13px;font-size:.95rem;
  font-weight:700;letter-spacing:.08em;background:var(--acc);color:#0b1f17;cursor:pointer;transition:.15s;margin-top:10px}
.btn:active{transform:scale(.96);filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.warn{background:var(--danger);color:#2a0d0d}
.btn.gold{background:var(--acc2);color:#2a1e08}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px;align-items:center}
.row .btn{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px 12px;background:rgba(255,255,255,.03);
  cursor:pointer;transition:.15s;user-select:none}
.tile:active{transform:scale(.95)}
.tile .t-ic{font-size:1.3rem}
.tile .t-nm{font-weight:700;font-size:.92rem;margin-top:6px}
.tile .t-sb{color:var(--faint);font-size:.72rem;margin-top:3px;line-height:1.5}
.tile.done{border-color:var(--acc);background:rgba(79,209,165,.10)}
.tile.done .t-nm{color:var(--acc)}
.ring{display:flex;gap:10px;margin-top:10px}
.step{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.step .s-n{font-size:.72rem;color:var(--faint)}
.step .s-c{font-family:var(--serif);font-size:1.25rem;margin:4px 0}
.step .s-b{border:none;border-radius:8px;background:rgba(255,255,255,.09);color:var(--ink);
  font-size:.8rem;padding:6px 0;width:100%;cursor:pointer}
.step .s-b:active{background:var(--acc);color:#0b1f17}
.step.full{border-color:var(--acc)}
.step.full .s-c{color:var(--acc)}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:999px;transition:width .4s}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(10,14,12,.94);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:none;background:none;color:var(--faint);font-size:.68rem;padding:6px 0 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
.tabbar button .i{font-size:1.15rem}
.tabbar button.on{color:var(--acc)}
.tabbar button:active{background:rgba(255,255,255,.06)}
.pill{display:inline-block;font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim);margin:3px 4px 3px 0;cursor:pointer;transition:.15s}
.pill:active{transform:scale(.93)}
.pill.on{border-color:var(--acc2);color:var(--acc2)}
.flag{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:7px;
  border:1px solid var(--line);font-size:.75rem;margin:3px;color:var(--faint)}
.flag.hit{background:rgba(79,209,165,.18);border-color:var(--acc)}
.vcard{border:1px solid var(--line);border-radius:20px;padding:30px 18px;text-align:center;background:rgba(255,255,255,.035);
  cursor:pointer;user-select:none;transition:.15s;margin-top:12px}
.vcard:active{transform:scale(.97)}
.vw{font-family:var(--serif);font-size:2.1rem;letter-spacing:.02em}
.vipa{color:var(--acc2);font-size:1.05rem;margin-top:8px}
.vcn{color:var(--dim);font-size:1.05rem;margin-top:8px;line-height:1.6}
.vtag{display:inline-block;font-size:.68rem;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-top:12px}
.stars{color:var(--acc2);font-size:.8rem;margin-top:6px;letter-spacing:.15em}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);
  color:var(--ink);padding:13px 14px;font-size:.95rem;line-height:1.55;margin-top:8px;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--acc);background:rgba(79,209,165,.12)}
.opt.wrong{border-color:var(--danger);background:rgba(255,123,123,.10)}
.grow{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.grow .g-nm{font-weight:700;font-size:.95rem}
.grow .g-mp{color:var(--faint);font-size:.72rem;margin-top:2px}
.stg{display:flex;gap:6px;margin-top:8px}
.stg span{flex:1;text-align:center;font-size:.72rem;border:1px solid var(--line);border-radius:8px;padding:6px 0;color:var(--faint);cursor:pointer;transition:.15s}
.stg span:active{transform:scale(.93)}
.stg span.on{border-color:var(--acc);color:var(--acc);background:rgba(79,209,165,.10)}
details{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:rgba(255,255,255,.02)}
summary{padding:11px 13px;font-size:.9rem;font-weight:600;cursor:pointer;list-style:none}
summary::before{content:'▸ ';color:var(--acc)}
details[open] summary::before{content:'▾ '}
.tpl{padding:8px 14px 12px;border-top:1px dashed var(--line);font-size:.85rem;line-height:1.8;color:var(--dim)}
.tpl .say{float:right;border:1px solid var(--line);border-radius:8px;background:none;color:var(--acc2);font-size:.72rem;padding:2px 8px;cursor:pointer}
.tpl .say:active{background:var(--acc2);color:#2a1e08}
.aurow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.aurow .nm{flex:1;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aub{border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink);font-size:.75rem;padding:5px 9px;cursor:pointer;flex:none}
.aub:active{background:var(--acc);color:#0b1f17}
.bdg{display:inline-block;width:31%;margin:1%;border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;vertical-align:top}
.bdg .bi{font-size:1.5rem;filter:grayscale(1);opacity:.4}
.bdg .bn{font-size:.68rem;color:var(--faint);margin-top:6px;line-height:1.4}
.bdg.on{border-color:var(--acc2)}
.bdg.on .bi{filter:none;opacity:1}
.bdg.on .bn{color:var(--acc2)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.05);color:var(--ink);
  padding:11px 12px;font-size:.95rem;font-family:var(--sans)}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1e2b25;border:1px solid var(--acc);
  color:var(--ink);padding:10px 18px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:86%;text-align:center}
#toast.show{opacity:1;bottom:100px}
#cvc{position:fixed;inset:0;pointer-events:none;z-index:55}
.rule{font-size:.82rem;color:var(--dim);line-height:1.75;padding-left:1.1em;text-indent:-1.1em;margin-top:6px}
.rule b{color:var(--acc2)}
</style>
</head>

const TEXTS={"U1":{"title":"The Best Medicine","paras":["As I approach the hospital wearing my white coat, I look just like any other doctor. That is until I put on my curly rainbow wig, big red nose, and add my name badge “Doctor Larry Laugh-Out-Loud”. I walk through the doors into the waiting area, where there’s a familiar atmosphere of boredom and tension. People sit uncomfortably on plastic chairs, looking through old magazines, all of which have been read hundreds of times previously. Anxious parents do what they can to comfort nervous and crying children.","In the middle of this particular scene I spot a small girl whose ankle is twice its normal size. I speak with the on-duty nurse, who tells me that Lara’s parents rushed her to the hospital after she fell off her bicycle. Since getting here, Lara has spent her time crying in pain. Although it’s the doctors and nurses who will treat her injury, it’s my job to make her feel better.","Scientific studies show that laughter produces chemicals to make people feel better, which means clown doctors can be helpful. We are specially trained clowns who work as part of a programme known as “hospital clowning”. I chose this career because of my experience of going to hospital when I was a kid. Although the doctors and nurses did a great job, hospitals weren’t really designed for children. I spent much of the time when I was there feeling frightened and more than a little bored! Being a clown doctor means I can help people by entertaining them.","Visiting hospitals and other health care facilities, we clown doctors work together with medical professionals. On a typical day, we spend our time cheering up patients, their families, and more often than not, the hospital staff, too! We do this by doing magic tricks, singing songs, telling stories and, of course, telling silly jokes. Some children, though, don’t feel like laughing, especially if they’re in pain. We have to be very sensitive and work closely with the doctors and nurses, who keep us updated on each patient.","And my magic medicine does indeed seem to do the trick. While the doctor concentrates on examining Lara’s ankle, I get her attention by doing a magic trick. Although she is clearly still in some pain, her scared and anxious look has been replaced – first by a small smile, and then by loud laughter as I “magically” produce her sock from out of my pocket. Seeing their daughter so much happier has in turn made Lara’s parents more relaxed.","And as for me? Well, when I take off my wig and my red nose, I’m still wearing a big smile, as I remember all the fun and laughter of the day. While there might be more hospital visits ahead for Lara and others, I hope that clown doctors help make it a friendlier place to visit. After all, it really is true that “laughter is the best medicine”."]},"U2":{"title":"We Regret to Inform You…","paras":["“We regret to inform you...” These are the words that every writer dreads receiving, but words every writer knows well. The response from a publisher comes back and the writer eagerly opens and reads it, their hearts sinking when they reach that final sentence. You may have spent years giving up your weekends and free time to write your life’s work, yet still this is often not enough. Everyone knows that success rarely happens overnight, but perhaps not many know that a lot of highly successful writers have previously faced rejection.","Take for example J.K. Rowling. When she received her first rejection letter, she decided that it meant she now had something in common with her favourite writers, and stuck it on her kitchen wall. Rowling had spent years surviving on little money, spending all her time writing. When she finally finished her first book, she received comments from publishers along the lines of “too difficult for children”, “too long”, “Children would not be interested in it”. Nevertheless, she persevered. “I wasn’t going to give up until every single publisher turned me down, but I often feared that would happen,” she later posted. After a total of twelve rejections, one publisher eventually agreed to print 500 copies of her first book, and as we know, Harry Potter became a global success, with over 400 million books sold and translated into more than seventy different languages.","All too often writers of great works have had to face criticism along with rejection. J.D. Salinger started writing short stories in high school, but later struggled to get his works published. “We feel that we don’t know the central character well enough” was the criticism he received on his manuscript for The Catcher in the Rye. Despite rejections from several publishers, J.D. Salinger refused to give up. Even when serving in the US Army during the Second World War, he carried six chapters of The Catcher in the Rye with him and worked on the novel throughout his war service. When it was eventually published, the book became an immediate best-seller and went on to sell millions and millions of copies.","Perhaps the overall prize for perseverance should go to three sisters from Victorian England who dreamt of seeing their words in print. This, however, was a time when women were not encouraged to become writers. As the then Poet Laureate, Robert Southey, wrote to one of them: “Literature cannot be the business of a woman’s life, and it ought not to be.” Nevertheless, the sisters didn’t stop trying. Their response was to write a book of poems under male names. Even when the book sold only two copies, the sisters still didn’t give up. They started writing novels, and today Charlotte Brontë’s Jane Eyre, Emily Brontë’s Wuthering Heights and Anne Brontë’s Agnes Grey are regarded as classics of world literature. In fact, it is within the pages of Jane Eyre that we can find these words: “I honour endurance, perseverance, industry, talent; because these are the means by which men achieve great ends…”","So, it seems that talent alone isn’t enough to guarantee success. While a lot of hard work and a touch of luck play a part, perseverance is the key. Keep trying and eventually you will read the words “We are delighted to inform you…”"]},"U3":{"title":"The Road to Success","paras":["Near the small town of Grottoes, Virginia, a narrow dirt road goes from the house of Stephen Curry’s grandfather to the woods nearby. A far cry from the bright lights and shiny courts of the National Basketball Association (NBA), it was along this road that Stephen’s grandfather built a simple basket by attaching a piece of plastic to a telephone pole.","Like his father, basketball star Dell Curry, Stephen spent many childhood hours playing on this muddy basketball court. He probably didn’t realise it at the time, but it was where he learnt to be creative and flexible as a player. You see, with every shot, the weak plastic backboard gave way. The bumps and rocks that lined the road under the basket caused the ball to bounce in all directions. Knowing where the ball would go wasn’t easy. He had to adjust his own playing style as a result. Shooting with great accuracy was another thing he learnt. Only shots perfectly aimed at its centre went into the heavy, thick basket. In this way, practising day in and day out helped Stephen sharpen his skills.","Despite his father’s successful career, Stephen was thought by many people, including his high school teammates and coaches, to be too short, too thin and too weak to follow in his father’s footsteps. But Stephen carried on. Playing basketball was his dream. He would not give up. He finally ended up playing college ball at a small, little-known school, Davidson College, not too far from where he lived. His creativity and perseverance made him Davidson’s star player.","Selected for the NBA in 2009, Stephen joined the Golden State Warriors. He performed beyond everyone’s expectations with his accurate shooting and continuous efforts. In 2015, Stephen won his first NBA championship, and he led the Warriors to their first championship since 1975.","After receiving the Most Valuable Player award for two years in a row, Stephen explained his philosophy, “I never really set out to change the game… What I wanted to do was just be myself… I know it inspires a lot of the next generation, a lot of people who love the game of basketball to value the skill of it, value the fact that you can work every single day to get better. You’ve got to be able to put in the time and the work. That’s how I got here. That’s how I continue to get better every single day.” Inspiring others to believe in themselves, Stephen Curry is living proof that what other people think of you does not have to influence what you become. Through self-belief, hard work, perseverance and some help from an old hoop, he has shown that anything is possible."]},"U4":{"title":"What Inspires You?","paras":["Every artist’s wish is to create something that expresses an idea. But where do artists get their ideas from? Who or what inspires them? Here we find out more about the influences behind the successes of three very different artists.","▸ Florentijn Hofman, visual artist","Florentijn Hofman is a Dutch artist, whose large sculptures are on display all over the world. One way for him to find inspiration is turning to his children’s toys. These objects have given him ideas for his animal sculptures, such as the famous Rubber Duck. A more recent work of his is the huge Floating Fish, which was set among the beautiful landscape of Wuzhen West Scenic Zone.","Hofman’s inspiration for Floating Fish came from Chinese folk tales passed down through the generations. He was particularly interested in the old story about a fish jumping through the “Dragon Gate”. This story came to life for Hofman when he visited Wuzhen and saw how people lived there.","“During the walk and my stay here in the town, I saw the fish being fed by people. You see also some fish sculpted on the wall.” These sights set Hofman’s idea for Floating Fish in motion.","▸ Tan Dun, composer","“There is no territory in the world of music.” These are the words of Chinese composer Tan Dun. He is most widely known for composing music for the film Crouching Tiger, Hidden Dragon and the 2008 Beijing Olympics.","To listen to Tan’s music is to experience a mix of Chinese musical traditions and Western influences. Since his first opera, Nine Songs, Tan Dun has been using a combination of Chinese music and sounds from all over the world to tell stories. As Tan once said, Chinese music should carry “universal expression” of the human spirit so as to be recognised by the whole world.","▸ Dao Meilan, dancer","Dao Meilan’s passion is dancing. Widely known as the “Peacock Princess”, she has dedicated her life to this art. Born into a Dai family in Xishuangbanna, Yunnan Province, Dao showed her talent for dancing from an early age. Her inspiration has come from the rich cultural heritage and traditional stories of her home town, which often feature the peacock, a symbol of natural beauty and good luck. She created amazing dances to bring out the charm of the beautiful birds and the local people’s lives. One of her most famous works is The Golden Peacock. Through years of effort, she has made her dances into a graceful picture of Dai culture, for audiences in China and around the world.","“In China, I dance to represent the Dai people, and abroad, I dance to represent China. A true artist must carry the spirit of their country in their heart,” said Dao."]},"U5":{"title":"A Journey of Discovery","paras":["The captain of the ship, the Beagle, wanted someone who would “profit by the opportunity of visiting distant countries yet little known”. The person who answered the call was not the captain’s first choice. It was a young man who had left medical school without completing his degree. What’s more, he had recently received a letter from his father predicting that he would be “a disgrace to yourself and all your family”. Despite all this, his adventures on this ship would lead to one of the most important scientific discoveries of all time.","The young man in question, Charles Darwin, was a geologist and naturalist, fascinated by rocks, plants and animals. He left England on the ship, the Beagle, in 1831. The journey gave him the chance to study various living things in their natural environments. After Darwin had spent some time in South America, his room on the ship was crowded with samples of the plants and animals he had collected. As he studied these, he asked himself the question: how did different species come to exist?","At that time, people believed that all species had appeared on Earth at the same time, and had not changed since. But Darwin began to think differently. He noticed that some species of animals were very similar to each other. Maybe animals evolved as they adapted to their changing environments? It was just an idea, but enough to inspire Darwin to look for more evidence.","When the Beagle reached the Galápagos Islands in 1835, Darwin saw a variety of new species, but it was the birds that interested him the most. Darwin noticed that there was a difference between the finches on each of the islands. It seemed their beaks had evolved according to what food was available on that particular island.","Darwin suspected that the finches had evolved from a common ancestor, which had arrived on the islands a long time before. Over time, it had slowly evolved into many new species. And that was the answer to how new species of plants and animals came to exist: they evolved from earlier ancestors.","It was a completely new idea – a theory of evolution. Darwin explained this theory in his book, On the Origin of Species. It was not published until 1859 and immediately caused a storm. Many people refused to believe that living things, including humans, had evolved from lower forms of life. They were shocked. But Darwin’s scientific studies were so convincing that more and more people started to believe his theory.","Today, On the Origin of Species is regarded as one of the most important works ever written. It has changed ideas about life on Earth forever. And it all began with the journey on the Beagle."]},"U6":{"title":"The Sky Railway","paras":["Sitting back in my seat, I can’t quite believe that I’m about to travel along the railway that many foreign experts claimed was “impossible”. The train has been racing along steadily since it left Xining. All this time, the song “Sky Railway” has been playing inside my head. The words “railways like massive dragons are winding among the mountains” seem particularly vivid as I travel across the “roof of the world”.","I was one of the people who came from all parts of China to work on this railway. Taking years to complete, the Qinghai-Xizang Railway is a record of all of our efforts to overcome the most difficult engineering challenges. How to protect the delicate ecosystem was among the top concerns.","The first landmark to catch my eye is the splendid Qingshuihe Bridge, the world’s longest bridge built over permafrost. Look! A group of Tibetan antelopes is moving under the bridge, with some stopping to eat grass at their leisure. Thirty-three passages have been built under the railway to allow the animals to move safely and freely in their natural habitat. Wild animals such as these Tibetan antelopes have now been using these passages for years. They seem totally unaware that we are speeding past at over 100 kilometres an hour.","To prevent damage to wetlands and grasslands, 675 bridges with a total length of about 160 kilometres were built between Golmud and Lhasa. We even moved 140,000 square metres of wetland to a new area in order to protect its distinct ecosystem.","The journey has been flying by, and before I know it, we have reached Tanggula Station. Located at over 5,000 metres above sea level, this is the highest railway station in the world. In locations such as this, the thin air, changeable weather and high levels of UV radiation presented perhaps the greatest challenge for railway workers. To make sure we stayed healthy, several oxygen-making stations were constructed. We were also able to enjoy regular breaks in lower areas.","As we pass Cuona Lake, I feel a sense of pride and achievement. Using thousands and thousands of sandbags, we built a twenty-kilometre wall along the lake to protect it from construction waste. Cuona Lake is so close to the railway that I want to reach out and touch its pale blue mirror-like surface. Water birds playing in the lake, and cattle and sheep wandering the grasslands bring the scenery to life.","The Qinghai-Tibet Plateau has been attracting people’s admiration for centuries. Now, thanks to our efforts, passengers from all over the country have been enjoying these magical landscapes. I am proud that we built our “impossible” railway, and did so with the care that the environment deserves. It truly is an extraordinary “Sky Railway”."]}};

function confetti(){const cv=$('cvc'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#4fd1a5','#ffd166','#ff8fa3','#7fb0ff','#f5d78e'];const ps=[];
 for(let i=0;i<80;i++)ps.push({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-0.5)*9,vy:-Math.random()*8-3,
  c:cols[i%5],r:Math.random()*4+2,ro:Math.random()*6});
 let f=0;(function tick(){ctx.clearRect(0,0,cv.width,cv.height);f++;
  for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=0.22;p.ro+=0.1;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ro);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r,p.r*2,p.r*1.2);ctx.restore();}
  if(f<110)requestAnimationFrame(tick);else ctx.clearRect(0,0,cv.width,cv.height);})();}

 document.body.removeChild(ta);}

const IDB={db:null,
 open(){return new Promise((res,rej)=>{if(IDB.db)return res(IDB.db);
  const r=indexedDB.open('elsa-audio',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('files');};
  r.onsuccess=()=>{IDB.db=r.result;res(IDB.db);};r.onerror=()=>rej(r.error);});},
 put(id,blob){return IDB.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');
  tx.objectStore('files').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);}));},
 get(id){return IDB.open().then(db=>new Promise((res,rej)=>{const rq=db.transaction('files').objectStore('files').get(id);
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);}));},
 del(id){return IDB.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');
  tx.objectStore('files').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);}));}};

function answerQuiz(ai,btn){
 if(QUIZ.lock)return;
 const q=SENT[QUIZ.li].qs[QUIZ.qi];
 const opts=btn.parentNode.querySelectorAll('.opt');
 if(ai===q.a){
  QUIZ.lock=true;btn.classList.add('right');
  if(QUIZ.review){S.sentWrong.shift();addBean(3);toast('✅ 线索消灭！+3 勇气豆');}
  else{const st=S.sent[QUIZ.li];st.qi++;addBean(1);}
  save();
  setTimeout(()=>{QUIZ.lock=false;renderQuiz();},700);
 }else{
  btn.classList.add('wrong');btn.disabled=true;
  const key=QUIZ.li+':'+QUIZ.qi;
  if(!QUIZ.review&&!S.sentWrong.includes(key)){S.sentWrong.push(key);save();}
  const why=$('qWhy');
  if(why)why.innerHTML='<div class="rule" style="margin-top:10px">🕵️ 线索解析：'+esc(q.why)+'</div>';
 }
}

function siftSt(i){return S.sift.st[i]||'';}
function siftStats(){let j=0,k=0,u=0,m=0;for(const key in S.sift.st){const v=S.sift.st[key];
 if(!v)continue;j++;if(v==='k')k++;else if(v==='u')u++;else if(v==='m'){m++;k++;}}return{judged:j,known:k,un:u,mastered:m};}

   html+='<span class="pill'+(jd===idxs.length?' on':'')+'" data-act="sfStart" data-arg="'+gi+'">'+esc(g)+(jd?' '+kn+'/'+jd:'')+'</span>';

 '<button class="btn ghost" data-act="sfSnap">📸 记录本次成绩</button>'+snapList()+'</div>';
 el.innerHTML=html;
 if(SF)renderSf();if(TR)renderTr();

function siftReport(){
 const st=siftStats();
 if(!st.judged)return '<div class="mut">还没有数据——从上面选一册开始过筛。</div>';
 const rows=[];let bp=-1;
 SIFT.grades.forEach(function(g,gi){
  const idxs=SIFT.poolIdx[gi];let jd=0,kn=0;
  for(const i of idxs){const v=siftSt(i);if(v){jd++;if(v!=='u')kn++;}}
  if(!jd)return;
  const rate=kn/jd;
  if(bp<0&&jd>=10&&rate<0.85)bp=gi;
  rows.push('<div class="mut" style="margin-top:4px">'+esc(g)+'：'+kn+'/'+jd+'（'+Math.round(rate*100)+'%）'+(jd>=10&&rate<0.85?' ⚠️':'')+'</div>');
 });
 let verdict;
 if(bp>=0)verdict='<div class="mut">📍 地基断点大约在 <b style="color:var(--acc2)">'+esc(SIFT.grades[bp])+'</b>——不认识的词优先进洞窟驯服；断点之前的册抽 20% 复查即可。</div>';
 else verdict='<div class="mut">✅ 已过筛部分全部达标（≥85%），继续往后筛。</div>';
 return verdict+'<div style="margin-top:8px">'+rows.join('')+'</div>';
}
function snapList(){
 const sn=S.sift.snaps.slice(-4);
 if(!sn.length)return '';
 return '<div style="margin-top:8px">'+sn.map(function(s){
  return '<div class="rule">📸 '+esc(s.d)+'：过筛 '+s.j+' · 认识 '+s.k+' · 洞窟 '+s.u+'</div>';}).join('')+'</div>';
}

 rd.readAsText(f);this.value='';});

 cave:S.caveOrder.length,conquered:S.conquered,mastered:masteredCount(),audio:S.audioMeta.length,
