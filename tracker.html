.hidden{display:none}

.big{font-family:var(--serif);font-size:1.5rem;line-height:1.35}

.btn.gold{background:var(--acc2);color:#2a1e08}

.row{display:flex;gap:8px;align-items:center}
.row .btn{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tile{border:1px solid var(--line);border-radius:14px;padding:14px 12px;background:rgba(255,255,255,.03);

.tile:active{transform:scale(.95)}
.tile .t-ic{font-size:1.3rem}
.tile .t-nm{font-weight:700;font-size:.92rem;margin-top:6px}
.tile .t-sb{color:var(--faint);font-size:.72rem;margin-top:3px;line-height:1.5}

.tile.done .t-nm{color:var(--acc)}
.ring{display:flex;gap:10px;margin-top:10px}
.step{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.step .s-n{font-size:.72rem;color:var(--faint)}

.step .s-b{border:none;border-radius:8px;background:rgba(255,255,255,.09);color:var(--ink);
  font-size:.8rem;padding:6px 0;width:100%;cursor:pointer}
.step .s-b:active{background:var(--acc);color:#0b1f17}
.step.full{border-color:var(--acc)}
.step.full .s-c{color:var(--acc)}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:999px;transition:width .4s}

.tabbar button .i{font-size:1.15rem}
.tabbar button.on{color:var(--acc)}
.tabbar button:active{background:rgba(255,255,255,.06)}
.pill{display:inline-block;font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim);margin:3px 4px 3px 0;cursor:pointer;transition:.15s}
.pill:active{transform:scale(.93)}
.pill.on{border-color:var(--acc2);color:var(--acc2)}
.flag{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:7px;

.vw{font-family:var(--serif);font-size:2.1rem;letter-spacing:.02em}
.vipa{color:var(--acc2);font-size:1.05rem;margin-top:8px}
.vcn{color:var(--dim);font-size:1.05rem;margin-top:8px;line-height:1.6}

.opt.right{border-color:var(--acc);background:rgba(79,209,165,.12)}

.grow .g-nm{font-weight:700;font-size:.95rem}
.grow .g-mp{color:var(--faint);font-size:.72rem;margin-top:2px}

.stg span:active{transform:scale(.93)}
.stg span.on{border-color:var(--acc);color:var(--acc);background:rgba(79,209,165,.10)}
details{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:rgba(255,255,255,.02)}
summary{padding:11px 13px;font-size:.9rem;font-weight:600;cursor:pointer;list-style:none}
summary::before{content:'▸ ';color:var(--acc)}
details[open] summary::before{content:'▾ '}
.tpl{padding:8px 14px 12px;border-top:1px dashed var(--line);font-size:.85rem;line-height:1.8;color:var(--dim)}
.tpl .say{float:right;border:1px solid var(--line);border-radius:8px;background:none;color:var(--acc2);font-size:.72rem;padding:2px 8px;cursor:pointer}
.tpl .say:active{background:var(--acc2);color:#2a1e08}
.aurow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.aurow .nm{flex:1;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aub{border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink);font-size:.75rem;padding:5px 9px;cursor:pointer;flex:none}
.aub:active{background:var(--acc);color:#0b1f17}
.bdg{display:inline-block;width:31%;margin:1%;border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;vertical-align:top}
.bdg .bi{font-size:1.5rem;filter:grayscale(1);opacity:.4}
.bdg .bn{font-size:.68rem;color:var(--faint);margin-top:6px;line-height:1.4}
.bdg.on{border-color:var(--acc2)}
.bdg.on .bi{filter:none;opacity:1}
.bdg.on .bn{color:var(--acc2)}

#toast.show{opacity:1;bottom:100px}
#cvc{position:fixed;inset:0;pointer-events:none;z-index:55}
.rule{font-size:.82rem;color:var(--dim);line-height:1.75;padding-left:1.1em;text-indent:-1.1em;margin-top:6px}
.rule b{color:var(--acc2)}

function confetti(){const cv=$('cvc'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#4fd1a5','#ffd166','#ff8fa3','#7fb0ff','#f5d78e'];const ps=[];
 for(let i=0;i<80;i++)ps.push({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-0.5)*9,vy:-Math.random()*8-3,
  c:cols[i%5],r:Math.random()*4+2,ro:Math.random()*6});
 let f=0;(function tick(){ctx.clearRect(0,0,cv.width,cv.height);f++;
  for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=0.22;p.ro+=0.1;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ro);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r,p.r*2,p.r*1.2);ctx.restore();}
  if(f<110)requestAnimationFrame(tick);else ctx.clearRect(0,0,cv.width,cv.height);})();}

const IDB={db:null,
 open(){return new Promise((res,rej)=>{if(IDB.db)return res(IDB.db);
  const r=indexedDB.open('elsa-audio',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('files');};
  r.onsuccess=()=>{IDB.db=r.result;res(IDB.db);};r.onerror=()=>rej(r.error);});},
 put(id,blob){return IDB.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');
  tx.objectStore('files').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);}));},
 get(id){return IDB.open().then(db=>new Promise((res,rej)=>{const rq=db.transaction('files').objectStore('files').get(id);
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);}));},
 del(id){return IDB.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');

   '<span class="faint" style="flex:none">'+m.p+' 遍</span>'+
   '<button class="aub" data-act="auPlay" data-arg="'+m.id+'">'+(curAudioId===m.id?'⏸':'▶')+'</button>'+
   '<button class="aub" data-act="auDone" data-arg="'+m.id+'">听完+1</button>'+
   '<button class="aub" data-act="auDel" data-arg="'+m.id+'">🗑</button></div>';
  }
  html+='<button class="btn ghost" data-act="auImp" data-arg="'+gk+'">📥 导入音频到此组</button></div>';
 }
 el.innerHTML=html;
}
function stopAudio(){if(curAudio){try{curAudio.pause();}catch(e){}curAudio=null;curAudioId=null;}}
/* ============ 我的页 ============ */
function renderMe(){
 const el=$('pg-me');
 let html='<div class="card"><div class="cttl">徽章墙</div>';
 for(const k in BADGES){
  const on=S.badges[k]?' on':'';
  html+='<div class="bdg'+on+'"><div class="bi">'+BADGES[k].i+'</div><div class="bn">'+BADGES[k].n+'<br><span style="opacity:.7">'+BADGES[k].d+'</span></div></div>';
 }
 html+='</div>';
 html+='<div class="card"><div class="cttl">容错五条明规则 · 贴在书桌前</div>'+
 RULES.map((r,i)=>'<div class="rule"><b>'+(i+1)+'.</b> '+r+'</div>').join('')+'</div>';
 html+='<div class="card"><div class="cttl">家长周报 · 只聊内容不查分数</div>'+
 '<p class="faint">家长三问："今天课文里哪个故事最有意思？"——周报帮您只看过程。</p>'+
 '<button class="btn gold" data-act="report">📋 生成本周周报（可复制发家庭群）</button></div>';
 html+='<div class="card"><div class="cttl">诊断卷回填</div>'+
 '<p class="faint">第一周做完《地基诊断卷》后，在这里记下结果，解锁"初诊完成"徽章。</p>'+
 '<div class="row" style="margin-top:8px"><input class="inp" id="diagInp" placeholder="例如：A档26/30 · B档18/30 · 句型断点在定语从句">'+
 '<button class="aub" data-act="diag" style="flex:none">记下</button></div>'+
 (S.diag?'<div class="rule" style="margin-top:8px">🧭 '+esc(S.diag)+'</div>':'')+'</div>';
 html+='<div class="card"><div class="cttl">设置与备份</div>'+
 '<div class="faint">进度数据只存在这台设备的浏览器里。换设备/清缓存前，请先导出备份。</div>'+
 '<div class="row" style="margin-top:10px"><button class="aub" data-act="wadj" data-arg="-1">◀ 周次-1</button>'+
 '<span style="flex:1;text-align:center" class="mut">当前第 '+curWeek()+' 周</span>'+
 '<button class="aub" data-act="wadj" data-arg="1">周次+1 ▶</button></div>'+
 '<button class="btn ghost" data-act="export">💾 导出备份（进度 JSON）</button>'+
 '<button class="btn ghost" data-act="import">📂 导入备份</button>'+
 '<button class="btn warn" data-act="reset">🗑 清空全部数据（慎用）</button></div>';
 el.innerHTML=html;
}
function weekReport(){
 const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*86400000);
  days.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));}
 let ticks=0;const per={listen:0,card:0,read:0,review:0,frag:0};
 for(const d of days){const r=S.daily[d]||{};for(const k in per)if(r[k]){per[k]++;ticks++;}}
 const plays=S.audioMeta.reduce((a,m)=>a+m.p,0);
 return '🌱 Elsa 英语追赶 · 第 '+curWeek()+' 周周报（'+phaseOf(curWeek()).name+'）\n'+
 '━━━━━━━━━━━━\n'+
 '🎯 本周打卡 '+ticks+'/35 格（聆听 '+per.listen+' 天 · 卡牌 '+per.card+' 天 · 精读 '+per.read+' 天 · 复盘 '+per.review+' 天 · 碎片泛听 '+per.frag+' 天）\n'+
 '🃏 词汇：已掌握 '+masteredCount()+'/451 · 洞窟待征服 '+S.caveOrder.length+' 张 · 累计征服错卡 '+S.conquered+' 张\n'+
 '🎧 听力库：'+S.audioMeta.length+' 段音频 · 累计听完 '+plays+' 遍\n'+
 '⚔️ 语法八考点进度 '+Object.values(S.gram).reduce((a,b)=>a+b,0)+'/24 · 错题宝藏存量 '+S.sentWrong.length+' 条\n'+
 '🫘 勇气豆 '+S.beans+' 颗 · 徽章 '+Object.keys(S.badges).length+'/'+Object.keys(BADGES).length+'\n'+
 '━━━━━━━━━━━━\n'+
 '家长三问本周版：课文里哪个故事最有意思？这周哪张错卡最"狡猾"？周末要玩哪部剧本杀？';
}
/* ============ 事件与启动 ============ */
const RENDER={today:renderToday,vocab:renderVocab,quest:renderQuest,audio:renderAudio,me:renderMe};
let TAB='today';
function go(t){TAB=t;stopAudio();
 document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
 $('pg-'+t).classList.remove('hidden');
 document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
 RENDER[t]();window.scrollTo(0,0);}
let resetArm=false;
document.body.addEventListener('click',function(ev){
 const el=ev.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act,arg=el.dataset.arg;
 switch(act){
  case 'setStart':{const d=$('startD');if(!d||!d.value){toast('先选一个起始日期');return;}
   S.startDate=d.value;save();confetti();toast('🚀 出发！第 1 周：诊断 + 地基');renderToday();break;}
  case 'day':{const r=dayRec();
   if(r[arg]){delete r[arg];}else{r[arg]=1;addBean(1);toast('✅ +1 勇气豆');}
   save();renderToday();break;}
  case 'b632':{const uk=unit632Target();if(!S.texts[uk])S.texts[uk]={l:0,r:0,rl:0,x:0};
   const tx=S.texts[uk],tg={l:6,r:3,rl:2}[arg];
   if(tx[arg]<tg){tx[arg]++;addBean(1);
    if(tx.l>=6&&tx.r>=3&&tx.rl>=2&&tx.x)award('txt-'+uk,'🎉 课文通关！'+UNITS[uk].name);}
   save();renderToday();break;}
  case 'x632':{const uk=unit632Target();if(!S.texts[uk])S.texts[uk]={l:0,r:0,rl:0,x:0};
   S.texts[uk].x=S.texts[uk].x?0:1;
   if(S.texts[uk].x){addBean(2);const tx=S.texts[uk];
    if(tx.l>=6&&tx.r>=3&&tx.rl>=2)award('txt-'+uk,'🎉 课文通关！'+UNITS[uk].name);}
   save();renderToday();break;}
  case 'unitNav':{S.curUnit=Math.max(0,Math.min(ORDER.length-1,(S.curUnit||0)+(+arg)));save();renderToday();break;}
  case 'ear':{if(award('ear','👂 听不懂勋章！坚持听完 6 遍不放弃，这本身就是胜利'))addBean(10);
   else{addBean(2);toast('👂 又是一次"没懂也不放弃" +2 勇气豆');}renderToday();break;}
  case 'game':{location.href=arg;break;}
  case 'pretty':{const inp=$('prettyInp');if(!inp||!inp.value.trim()){toast('先写下这个"有信息量的错误"');return;}
   S.pretty[today()+' '+new Date().toTimeString().slice(0,5)]={t:inp.value.trim()};
   award('pretty','🌷 漂亮的错误！这个错误值得表彰');addBean(2);save();renderToday();break;}
  case 'say':{speak(arg);break;}
  case 'sesStart':{SES={queue:buildSession(12),idx:0,flip:false,tamed:0,failed:0,lock:false};
   if(!SES.queue.length){SES=null;toast('词库已全部掌握，去看看洞窟吧');}renderVocab();break;}
  case 'sesCave':{SES={queue:S.caveOrder.slice(0,12),idx:0,flip:false,tamed:0,failed:0,lock:false};
   if(!SES.queue.length){SES=null;toast('洞窟是空的，太厉害了');}renderVocab();break;}
  case 'flip':{if(SES){SES.flip=true;renderSes();}break;}
  case 'sesOk':{if(!SES||SES.lock)break;SES.lock=true;
   const id=SES.queue[SES.idx],r=vrec(id);
   if(S.caveOrder.includes(id)){r.m+=2;r.b=Math.min(5,r.b+1);
    S.caveOrder=S.caveOrder.filter(x=>x!==id);S.conquered++;addBean(2);
    toast('⚡ 征服错卡！双倍印记 +2 · +2 勇气豆');
    if(S.conquered>=10)award('cave','🏅 洞窟修炼者！已征服 10 张错卡');
   }else{r.b=Math.min(5,r.b+1);r.m+=1;}
   SES.tamed++;save();
   setTimeout(()=>{SES.idx++;SES.flip=false;SES.lock=false;renderSes();},450);break;}
  case 'sesFail':{if(!SES||SES.lock)break;SES.lock=true;
   const id=SES.queue[SES.idx],r=vrec(id);r.b=1;
   if(!S.caveOrder.includes(id))S.caveOrder.push(id);
   const pos=Math.min(SES.idx+3,SES.queue.length);
   SES.queue.splice(pos,0,id);SES.failed++;save();
   toast('🌀 已回流——第 3 张之后再见面');
   setTimeout(()=>{SES.idx++;SES.flip=false;SES.lock=false;renderSes();},450);break;}
  case 'sesDone':{renderVocab();break;}
  case 'qStart':{QUIZ={li:+arg,lock:false};renderQuest();renderQuiz();break;}
  case 'qReview':{QUIZ={review:true,lock:false};renderQuest();renderQuiz();break;}
  case 'qAns':{answerQuiz(+arg,el);break;}
  case 'gram':{const p=arg.split(':'),i=+p[0],j=+p[1],st=S.gram[i]||0;
   S.gram[i]=(st>j)?j:j+1;addBean(1);save();renderQuest();break;}
  case 'wtpl':{const w='W'+curWeek(),wk=S.write[w]||(S.write[w]={tpl:[]});
   wk.tpl=wk.tpl||[];const i=+arg;
   if(wk.tpl.includes(i))wk.tpl=wk.tpl.filter(x=>x!==i);else wk.tpl.push(i);
   save();renderQuest();break;}
  case 'wdone':{const w='W'+curWeek(),wk=S.write[w]||(S.write[w]={tpl:[]});
   if(wk.done){wk.done=0;toast('已取消打卡');}
   else{wk.done=1;addBean(10);confetti();
    if(award('pen','✒️ 下笔有神！第一次作文打卡')){}else toast('✅ 本周作文打卡 +10 勇气豆');}
   S.write[w]=wk;save();renderQuest();break;}
  case 'auImp':{importGroup=arg;$('audioInp').click();break;}
  case 'auPlay':{const m=S.audioMeta.find(x=>x.id===arg);if(!m)break;
   if(curAudioId===arg){stopAudio();renderAudio();break;}
   stopAudio();
   IDB.get(arg).then(blob=>{
    if(!blob){toast('音频文件不在了，请重新导入');return;}
    curAudio=new Audio(URL.createObjectURL(blob));curAudioId=arg;
    curAudio.onended=()=>{stopAudio();renderAudio();};
    curAudio.play().then(()=>renderAudio()).catch(()=>{toast('播放被拦截，再点一次试试');stopAudio();});
   }).catch(()=>toast('读取音频失败'));break;}
  case 'auDone':{const m=S.audioMeta.find(x=>x.id===arg);if(m){m.p++;addBean(1);save();renderAudio();toast('🎧 第 '+m.p+' 遍完成');}break;}
  case 'auDel':{S.audioMeta=S.audioMeta.filter(x=>x!==undefined&&x.id!==arg);
   IDB.del(arg).catch(()=>{});if(curAudioId===arg)stopAudio();save();renderAudio();toast('已删除');break;}
  case 'report':{copyTxt(weekReport());break;}
  case 'diag':{const inp=$('diagInp');if(!inp||!inp.value.trim()){toast('先写下诊断结果');return;}
   S.diag=inp.value.trim();award('diag','🧭 初诊完成！第一天就用数字证明"你不是零基础"');addBean(10);save();renderMe();break;}
  case 'wadj':{S.weekAdj=(S.weekAdj||0)+(+arg);save();renderMe();break;}
  case 'export':{const t=JSON.stringify(S,null,1);
   try{const b=new Blob([t],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='elsa-tracker-backup-'+today()+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('已导出备份文件');}
   catch(e){copyTxt(t);}break;}
  case 'import':{$('bakInp').click();break;}
  case 'reset':{if(!resetArm){resetArm=true;toast('⚠️ 再点一次确认清空全部数据');
   setTimeout(()=>resetArm=false,3000);break;}
   S=defState();save();toast('已清空，重新开始');go('today');break;}
 }
});
$('tabbar').addEventListener('click',function(ev){
 const b=ev.target.closest('button[data-tab]');if(b)go(b.dataset.tab);});
$('audioInp').addEventListener('change',function(){
 const files=Array.from(this.files||[]);if(!files.length)return;
 let done=0,ok=0;
 files.forEach((f,i)=>{
  const id='a'+Date.now()+'-'+i;
  IDB.put(id,f).then(()=>{S.audioMeta.push({id:id,n:f.name,g:importGroup,p:0});ok++;})
   .catch(()=>{}).finally(()=>{done++;
    if(done===files.length){save();renderAudio();toast('📥 导入完成 '+ok+'/'+files.length+' 段');}});
 });
 this.value='';});
$('bakInp').addEventListener('change',function(){
 const f=this.files&&this.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);S=Object.assign(defState(),o);save();
  toast('✅ 备份已恢复');go('me');}catch(e){toast('备份文件无法识别');}};
 rd.readAsText(f);this.value='';});
/* 启动 */
$('beanTop').textContent=S.beans;
document.querySelector('#tabbar button[data-tab="today"]').classList.add('on');
renderToday();
/* 调试句柄 */
window.__DBG={state:function(){return {tab:TAB,week:curWeek(),beans:S.beans,badges:Object.keys(S.badges),
 cave:S.caveOrder.length,conquered:S.conquered,mastered:masteredCount(),audio:S.audioMeta.length,
 sentWrong:S.sentWrong.length,daily:S.daily[today()]||{},texts:S.texts,quiz:QUIZ?{li:QUIZ.li,qi:QUIZ.qi,review:!!QUIZ.review}:null,
 ses:SES?{idx:SES.idx,left:SES.queue.length-SES.idx}:null};}};
})();
</script>
</body>
